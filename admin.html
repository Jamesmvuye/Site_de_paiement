<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="dark">
  <title>Administration – LEARN MORE DATA</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .admin-wrap { max-width: 1100px; margin: 0 auto; padding: 2rem 1rem 4rem; }
    .admin-bar { display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
    .admin-bar h1 { font-size: 1.4rem; font-weight: 800; }
    .admin-tabs { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .admin-tabs button { padding: 0.45rem 0.9rem; border-radius: 999px; border: 1px solid var(--border); background: transparent; color: var(--text-muted); cursor: pointer; font: inherit; font-size: 0.85rem; }
    .admin-tabs button.active { background: var(--brand-500, #2563eb); color: #fff; border-color: transparent; }
    .login-box { max-width: 380px; margin: 12vh auto 0; padding: 1.75rem; }
    .pay-list { display: grid; gap: 0.9rem; }
    .pay-card { display: grid; grid-template-columns: 120px 1fr auto; gap: 1rem; align-items: center; padding: 1rem; }
    .pay-thumb { width: 120px; height: 120px; object-fit: cover; border-radius: 0.6rem; border: 1px solid var(--border); background: var(--surface-muted); cursor: zoom-in; }
    .pay-info { display: grid; gap: 0.2rem; font-size: 0.875rem; min-width: 0; }
    .pay-info strong { font-size: 1rem; }
    .pay-info span { color: var(--text-muted); overflow-wrap: anywhere; }
    .pay-actions { display: grid; gap: 0.5rem; }
    .pay-actions button { white-space: nowrap; }
    .badge { display: inline-block; padding: 0.15rem 0.6rem; border-radius: 999px; font-size: 0.72rem; font-weight: 700; }
    .badge.pending { background: rgba(251, 191, 36, 0.15); color: #fbbf24; }
    .badge.approved { background: rgba(52, 211, 153, 0.15); color: #34d399; }
    .badge.rejected { background: rgba(248, 113, 113, 0.15); color: #f87171; }
    .empty { text-align: center; color: var(--text-muted); padding: 2.5rem 0; }
    .error-text { color: #f87171; font-size: 0.85rem; margin-top: 0.75rem; min-height: 1.2em; }
    @media (max-width: 640px) {
      .pay-card { grid-template-columns: 90px 1fr; }
      .pay-thumb { width: 90px; height: 90px; }
      .pay-actions { grid-column: 1 / -1; grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <div class="ambient-glow-top"></div>

  <!-- Connexion -->
  <main id="loginView" class="login-box glass-card" style="display:none;">
    <div class="glass-highlight"></div>
    <h1 style="font-size:1.3rem; font-weight:800; margin-bottom:1.2rem;">Administration</h1>
    <form id="loginForm">
      <div style="margin-bottom:1rem;">
        <label class="input-label" for="loginEmail">E-mail</label>
        <input class="input" id="loginEmail" type="email" required autocomplete="username">
      </div>
      <div style="margin-bottom:1rem;">
        <label class="input-label" for="loginPassword">Mot de passe</label>
        <input class="input" id="loginPassword" type="password" required autocomplete="current-password">
      </div>
      <button class="btn-primary" style="width:100%;" type="submit">Se connecter</button>
      <p class="error-text" id="loginError" role="alert"></p>
    </form>
  </main>

  <!-- Tableau de bord -->
  <main id="dashView" class="admin-wrap" style="display:none;">
    <div class="admin-bar">
      <h1>Paiements</h1>
      <div class="admin-tabs" id="statusTabs" role="group" aria-label="Filtrer par statut">
        <button type="button" data-status="pending" class="active">En attente</button>
        <button type="button" data-status="approved">Validés</button>
        <button type="button" data-status="rejected">Refusés</button>
      </div>
      <button class="btn-secondary" id="logoutBtn" type="button">Déconnexion</button>
    </div>
    <p class="error-text" id="dashError" role="alert"></p>
    <div class="pay-list" id="payList"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
